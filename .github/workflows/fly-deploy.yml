# See https://docs.fly.io/launch/continuous-deployment-with-github-actions

name: Fly Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app yugumo-note-2024
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

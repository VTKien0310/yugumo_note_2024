<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Soft Drop Shadow for Document -->
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#2D3748" flood-opacity="0.14" />
    </filter>

    <!-- Shadow for Badge/Accessories -->
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- BACKGROUND CORNER FOLD TAB (Top-Right) -->
  <path d="M 270 54 L 306 90 L 270 90 Z" fill="#E2E8F0" stroke="#333333" stroke-width="3" stroke-linejoin="round"/>

  <!-- MAIN MARKDOWN DOCUMENT BODY -->
  <path d="M 104 54 
           L 270 54 
           L 306 90 
           L 306 330 
           A 16 16 0 0 1 290 346 
           L 110 346 
           A 16 16 0 0 1 94 330 
           L 94 70 
           A 16 16 0 0 1 104 54 Z"
        fill="#FCFBF7"
        stroke="#333333"
        stroke-width="3.5"
        stroke-linejoin="round"
        filter="url(#card-shadow)" />

  <!-- DECORATIVE TOP BOOKMARK / TAB (Yellow polka dot style) -->
  <g transform="translate(130, 36)">
    <path d="M 0 0 L 24 0 L 24 30 L 12 21 L 0 30 Z" fill="#F6C343" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="7" cy="8" r="1.5" fill="#FFFFFF"/>
    <circle cx="17" cy="8" r="1.5" fill="#FFFFFF"/>
    <circle cx="12" cy="15" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- MARKDOWN HERO BADGE (Playful Pill Badge) -->
  <g transform="translate(125, 86)" filter="url(#sticker-shadow)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="150" height="92" rx="14" fill="#3B82F6" stroke="#2B3A4A" stroke-width="3.5"/>
    
    <!-- White Inner Container for standard MD Icon Look -->
    <rect x="7" y="7" width="136" height="78" rx="9" fill="#2563EB"/>

    <!-- 'M' Lettermark -->
    <path d="M 23 66 L 23 26 L 39 42 L 55 26 L 55 66" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Down Arrow Icon -->
    <path d="M 87 28 L 87 58 M 72 44 L 87 59 L 102 44" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Little friendly spark on badge -->
    <circle cx="123" cy="20" r="3" fill="#FDE047"/>
  </g>

  <!-- EXTENSION BADGE: ".MD" -->
  <g transform="translate(230, 160)" filter="url(#sticker-shadow)">
    <rect x="0" y="0" width="58" height="24" rx="7" fill="#10B981" stroke="#333333" stroke-width="2.5"/>
    <text x="29" y="16" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" 
          font-weight="900" 
          fill="#FFFFFF" 
          text-anchor="middle">.MD</text>
  </g>

  <!-- SYNTAX CONTENT LINES (Hand-Drawn / Whimsical feel) -->
  <g transform="translate(120, 206)">
    <!-- Row 1: Heading Token "# " + Heading Bar -->
    <text x="0" y="17" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#64748B">#</text>
    <rect x="22" y="5" width="128" height="12" rx="6" fill="#334155"/>

    <!-- Row 2: List Token "- [x]" with small checkbox -->
    <g transform="translate(0, 32)">
      <rect x="2" y="2" width="13" height="13" rx="3.5" fill="#EEF2F6" stroke="#64748B" stroke-width="2.2"/>
      <path d="M 5 8.5 L 8 11.5 L 14 5" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="24" y="4" width="116" height="9" rx="4.5" fill="#CBD5E1"/>
    </g>

    <!-- Row 3: List Token "- [ ]" with empty checkbox -->
    <g transform="translate(0, 56)">
      <rect x="2" y="2" width="13" height="13" rx="3.5" fill="#EEF2F6" stroke="#94A3B8" stroke-width="2.2"/>
      <rect x="24" y="4" width="94" height="9" rx="4.5" fill="#E2E8F0"/>
    </g>

    <!-- Row 4: Code Block Line -->
    <g transform="translate(0, 80)">
      <text x="0" y="12" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#F43F5E">`&gt;`</text>
      <rect x="24" y="3" width="76" height="8" rx="4" fill="#CBD5E1"/>
    </g>
  </g>

  <!-- PENCIL ACCESSORY (Echoing playful tool aesthetic) -->
  <g transform="translate(72, 235) rotate(-28)" filter="url(#sticker-shadow)">
    <!-- Body -->
    <path d="M 0 0 L 12 0 L 12 60 L 0 60 Z" fill="#FBBF24" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Collar & Eraser -->
    <rect x="0" y="-8" width="12" height="8" fill="#E2E8F0" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 0 -8 A 6 6 0 0 1 12 -8 Z" fill="#F472B6" stroke="#333333" stroke-width="2.5"/>
    <!-- Wood tip & Lead -->
    <path d="M 0 60 L 12 60 L 6 76 Z" fill="#FDE68A" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="4,71 8,71 6,76" fill="#333333"/>
  </g>

  <!-- SIDE BOOKMARK TABS (Right Edge) -->
  <g transform="translate(305, 195)">
    <!-- Cyan Tab with Pattern -->
    <path d="M 0 0 L 22 0 L 30 11 L 22 22 L 0 22 Z" fill="#06B6D4" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="8" cy="11" r="1.5" fill="#FFFFFF"/>
    <circle cx="16" cy="11" r="1.5" fill="#FFFFFF"/>

    <!-- Coral Pink Tab -->
    <path d="M 0 28 L 24 28 L 30 39 L 24 50 L 0 50 Z" fill="#F87171" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Striped Indigo Tab -->
    <path d="M 0 56 L 22 56 L 30 67 L 22 78 L 0 78 Z" fill="#6366F1" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="6" y1="58" x2="16" y2="76" stroke="#A5B4FC" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- SUBTLE KAWAII / FRIENDLY TOUCHES -->
  <!-- Tiny decorative sparkle star -->
  <path d="M 98 120 Q 98 128 90 128 Q 98 128 98 136 Q 98 128 106 128 Q 98 128 98 120 Z" fill="#F59E0B"/>
  <circle cx="292" cy="132" r="3" fill="#60A5FA"/>
</svg>
